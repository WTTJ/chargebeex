name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: WTTJ/domain-platform/.github/workflows/common_release_please.yml@v1

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17.2'
          otp-version: '26.2.5.2'

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check version consistency
        run: |
          MIX_VERSION=$(mix run -e 'IO.puts Mix.Project.config[:version]')
          RELEASE_VERSION=${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION=${RELEASE_VERSION#v}

          if [ "$MIX_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch: mix.exs version ($MIX_VERSION) != release version ($RELEASE_VERSION)"
            exit 1
          fi

      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEXPM_PUBLIC_PACKAGES_KEY }}
        run: mix hex.publish --yes

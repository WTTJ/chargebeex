name: Elixir CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["26.x", "27.x", "28.x"]
        elixir: ["1.15.x", "1.16.x", "1.17.x", "1.18.x", "1.19.x"]
        exclude:
          - elixir: 1.15.x
            otp: 27.x
          - elixir: 1.16.x
            otp: 27.x
          - elixir: 1.15.x
            otp: 28.x
          - elixir: 1.16.x
            otp: 28.x
          - elixir: 1.17.x
            otp: 28.x
    steps:
      - uses: actions/checkout@v4
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
        env:
          ImageOS: ubuntu24
      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Run tests
        run: mix test
